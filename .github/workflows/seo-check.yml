name: SEO/GEO check

# Fails when the generated SEO/GEO content (noscript lists, structured data,
# llms.txt, sitemap.xml) is out of date, or a page lacks its basic SEO tags.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  seo-geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SEO/GEO content is up to date
        run: python3 scripts/build_seo.py --check
